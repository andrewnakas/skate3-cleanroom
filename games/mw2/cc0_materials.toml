# CC0 PBR material library for the clean MW2 maps (games/mw2/materials.py).
#
# Every set comes from ambientCG (https://ambientcg.com, Lennart Demes and
# contributors), published under Creative Commons CC0 1.0 Universal
# (https://docs.ambientcg.com/license/). Nothing here is retail data. The
# pipeline downloads the 1K-JPG zip of each set at run time into a cache dir
# (never committed), checks the asset against the ambientCG API and the site's
# licence page, and keeps only Color, NormalGL, Roughness, AmbientOcclusion,
# Metalness and Displacement.
#
# Per entry: class (what the classifier picks), what, author, source, license,
# id + url (the 1K-JPG download), size_m (real-world width of one tile, from
# the API's dimensionX when it gives one, else an estimate), metal (0..1:
# scales the set's Metalness map, or is the constant metalness when it has
# none; kept low because the maps have no reflection probes), normal
# (normal-map strength, 1 = as published).

